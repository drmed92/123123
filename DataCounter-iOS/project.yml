# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: DataCounter
options:
  bundleIdPrefix: com.drmed
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: "" # your Apple ID team; or pick it in Xcode > Signing & Capabilities
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: 1
targets:
  DataCounter:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Data Counter
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.drmed.datacounter.refresh]
    entitlements:
      path: App/DataCounter.entitlements
      properties:
        com.apple.security.application-groups: [group.com.drmed.datacounter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drmed.datacounter
    dependencies:
      - target: DataCounterWidget
    scheme:
      testTargets: [DataCounterTests]
  DataCounterWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Data Counter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/DataCounterWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.drmed.datacounter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drmed.datacounter.widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET
  DataCounterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DataCounter
